<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="#0B1220">
  <!-- A database as three separate discs, drawn bottom first so each hides the one below. The scene pulls the middle one out. -->
  <g stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <g id="theft-bottom"><path d="M30 130v34a60 22 0 0 0 120 0v-34"/><ellipse cx="90" cy="130" rx="60" ry="22"/></g>
    <g id="theft-mid"><path d="M30 84v34a60 22 0 0 0 120 0V84"/><ellipse cx="90" cy="84" rx="60" ry="22"/></g>
    <g id="theft-top"><path d="M30 38v34a60 22 0 0 0 120 0V38"/><ellipse cx="90" cy="38" rx="60" ry="22"/></g>
  </g>
</svg>
